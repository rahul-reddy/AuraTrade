# The hosted AuraTrade stack on its Lightsail server (docs/DEPLOYMENT.md).
# deploy/server-deploy.sh runs it as project "auratrade" with the server's
# ~/auratrade/.env, which holds AURATRADE_SITE_HOST, POSTGRES_PASSWORD,
# AUTH_SECRET and optionally AURATRADE_FINVIZ_TOKEN. Only Caddy publishes ports; the web server and database are
# reachable only inside this compose network.
name: auratrade
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auratrade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: auratrade
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auratrade -d auratrade"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: `run --rm migrate` applies migrations; also runs deploy/set-user.mjs.
  migrate:
    build:
      context: ..
      target: migrate
    image: auratrade-migrate:${AURATRADE_REVISION:-local}
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://auratrade:${POSTGRES_PASSWORD:?}@db:5432/auratrade
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
    image: auratrade-web:${AURATRADE_REVISION:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://auratrade:${POSTGRES_PASSWORD:?}@db:5432/auratrade
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_URL: https://${AURATRADE_SITE_HOST:?}
      AUTH_TRUST_HOST: "true"
      # Optional, server-only Finviz daily export credential. Never a build arg.
      AURATRADE_FINVIZ_TOKEN: ${AURATRADE_FINVIZ_TOKEN:-}
      # Fixed here, not read from .env: the hosted server never has public sign-up.
      AURATRADE_REGISTRATION: closed
      AURATRADE_HEALTH_FILE: /app/operational-health/status.json
    volumes:
      - ${HOME}/auratrade/health:/app/operational-health:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  # The only service the internet can reach: HTTPS with an automatic certificate.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      AURATRADE_SITE_HOST: ${AURATRADE_SITE_HOST:?}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
