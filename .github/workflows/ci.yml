name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # merge-pr.ps1 requires a successful check with exactly this name.
    name: Verify AuraTrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auratrade
          POSTGRES_PASSWORD: auratrade_ci
          POSTGRES_DB: auratrade_ci
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U auratrade" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://auratrade:auratrade_ci@127.0.0.1:5432/auratrade_ci
      SHADOW_DATABASE_URL: postgresql://auratrade:auratrade_ci@127.0.0.1:5432/auratrade_shadow
      AUTH_TRUST_HOST: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Synthetic broker fixtures only; no requests to Schwab in CI.
      SCHWAB_TOKEN_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SCHWAB_CLIENT_ID: synthetic-ci-client
      SCHWAB_CLIENT_SECRET: synthetic-ci-secret
      SCHWAB_TEST_DATABASE_URL: postgresql://auratrade:auratrade_ci@127.0.0.1:5432/auratrade_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history is needed for secret scanning, including docs-only PRs.
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked private files
        run: python3 scripts/check-public-files.py
      - name: Scan secrets (public and private repositories)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          scanner=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
          trap 'rm -rf "$scanner"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$scanner/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner/gitleaks.tar.gz" -C "$scanner" gitleaks
          "$scanner/gitleaks" git . --log-opts=--all --redact=100 --no-banner
      # A change to documentation alone skips the tests to save Actions minutes,
      # but this job still runs and passes, because merge-pr.ps1 requires it.
      # Docs-only means every changed path (both sides of a rename) is docs/** or
      # a Markdown file at the repository root; Markdown anywhere else (skills)
      # can be read by code. Anything this step cannot establish runs the full
      # suite: only docs_only=true skips.
      - name: Classify the change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            # The checkout is GitHub's merge of the PR into its base: its first
            # parent is the base, so the diff to it is exactly the PR's change.
            if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
              base=$(git rev-parse HEAD^1)
            fi
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # Full checkout already contains prior main; no authenticated fetch
            # is needed after checkout has removed its credentials.
            git cat-file -e "$BEFORE^{commit}" && base="$BEFORE"
          fi
          if [ -z "$base" ] || ! changed=$(git diff --name-only --no-renames "$base" HEAD); then
            echo "Could not list the change; running everything."
            exit 0
          fi
          if [ -z "$changed" ]; then
            echo "Empty change; running everything."
            exit 0
          fi
          echo "$changed"
          while IFS= read -r path; do
            case "$path" in
              docs/*) ;;
              */*) echo "Not docs-only: $path"; exit 0 ;;
              *.md) ;;
              *) echo "Not docs-only: $path"; exit 0 ;;
            esac
          done <<< "$changed"
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
      - name: "Docs-only change: skipping tests"
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "Only docs/ or root Markdown changed; tests skipped. The secret scan still runs." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: steps.scope.outputs.docs_only != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.docs_only != 'true'
      - name: Verify agent harness
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          pwsh -NoProfile -File scripts/cross-review-selftest.ps1
          uv run --no-project --with pyyaml python scripts/validate_skills.py
      - name: Verify operational backup and restore scripts
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          for script in deploy/backup.sh deploy/restore-check.sh deploy/server-deploy.sh; do sh -n "$script"; done
          bash -n scripts/deploy-prebuilt.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: npx prisma generate
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run lint && npm run typecheck
        if: steps.scope.outputs.docs_only != 'true'
      - name: Verify migrations on a fresh database and check for drift
        if: steps.scope.outputs.docs_only != 'true'
        env:
          PGPASSWORD: auratrade_ci
        run: |
          psql -h 127.0.0.1 -U auratrade -d auratrade_ci -c 'CREATE DATABASE auratrade_shadow'
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - run: npm test -- --coverage
        if: steps.scope.outputs.docs_only != 'true'
      - name: Generate a throwaway auth secret for this run
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          secret=$(openssl rand -base64 32)
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Plant synthetic private-file tracing canaries
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p documents .local
          printf 'synthetic private-file canary\n' > documents/security-canary.csv
          printf 'synthetic private-file canary\n' > .local/security-canary.txt
      - run: npm run build
        if: steps.scope.outputs.docs_only != 'true'
      - name: Reject private files in the standalone bundle
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/check-public-files.py --standalone .next/standalone
      - name: Browser tests against the production build
        if: steps.scope.outputs.docs_only != 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          npx playwright install --with-deps chromium
          npm run start -- -H 127.0.0.1 -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/login && break
            sleep 2
          done
          npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.scope.outputs.docs_only != 'true'
        with:
          name: verification-evidence
          path: |
            coverage
            playwright-report
            test-results
            next-start.log
      - name: Dependency advisory
        if: steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        run: npm audit --audit-level=high
