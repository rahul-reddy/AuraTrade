name: Deliver container
# Builds and publishes the web image after CI passes on a push to main. This
# never deploys anything: deployment is a separate manual step (docs/DEPLOYMENT.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/rahul-reddy/auratrade-web:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.source=https://github.com/rahul-reddy/AuraTrade
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
