version: 2
updates:
  # Security PRs remain enabled; avoid routine npm version churn/Actions usage.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      action-pins:
        patterns: ['*']
